---
# tasks file for arillso.ca-certificates

- name: add OS specific variables
  include_vars: '{{ loop_vars }}'
  with_first_found:
    - files:
        - '{{ distribution }}-{{ distribution_version }}.yml'
        - '{{ distribution }}-{{ distribution_major_version }}.yml'
        - '{{ distribution }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
        - '{{ ansible_facts["system"] }}.yml'
        - 'defaults.yml'
      paths:
        - 'vars'
  loop_control:
    loop_var: loop_vars
  vars:
    distribution: '{{ ansible_facts["distribution"] }}'
    distribution_version: '{{ ansible_facts["distribution_version"] }}'
    distribution_major_version: '{{ ansible_facts["distribution_major_version"] }}'
  tags:
    - configuration
    - packages

- name: include distribution tasks
  include_tasks: '{{ loop_distribution }}'
  with_first_found:
    - files:
        - '{{ distribution }}-{{ distribution_version }}.yml'
        - '{{ distribution }}-{{ distribution_major_version }}.yml'
        - '{{ distribution }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
        - '{{ ansible_facts["system"] }}.yml'
        - 'defaults.yml'
      paths:
        - 'distribution'
  loop_control:
    loop_var: loop_distribution
  vars:
    distribution: '{{ ansible_facts["distribution"] }}'
    distribution_version: '{{ ansible_facts["distribution_version"] }}'
    distribution_major_version: '{{ ansible_facts["distribution_major_version"] }}'
  tags:
    - configuration
    - packages
